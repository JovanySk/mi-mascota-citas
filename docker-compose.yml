# Runs the app against SQL Server 2022.
# Create a .env file (not committed) next to this file with:
#   MSSQL_SA_PASSWORD=YourStrong!Passw0rd
#   ADMIN_EMAIL=tu@correo.mx
#   ADMIN_PASSWORD=<first administrator password>
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__SqlServer: "Server=db,1433;Database=MiMascota;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
    volumes:
      - web-data:/app/data
    ports:
      - "8080:8080"

volumes:
  web-data:
